<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>COCINET Pro Version 2026</title>
    <!-- Meta tags for PWA mobile app behavior -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="COCINET Pro" />
    <script>
      window.__COCINET_PWA_PROMPT__ = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__COCINET_PWA_PROMPT__ = e;
        console.log('📲 [PWA Early Listener] Evento beforeinstallprompt capturado en index.html');
      });
      window.addEventListener('appinstalled', function() {
        window.__COCINET_PWA_PROMPT__ = null;
        console.log('🎉 [PWA Early Listener] App instalada exitosamente.');
      });

      // Detectar tenant desde URL o candado de terminal de Windows
      var params = new URLSearchParams(window.location.search);
      var tenantParam = params.get('tenant') || params.get('sucursal') || params.get('company') || params.get('id');
      var lockedTenant = localStorage.getItem('cocinet_locked_terminal_tenant_id');
      var activeTenant = tenantParam || (lockedTenant ? lockedTenant.replace(/^tenant-/, '') : null);

      var manifestHref = activeTenant 
        ? ('/manifest-pwa.json?tenant=' + encodeURIComponent(activeTenant)) 
        : ((window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') ? '/manifest-dev.json' : '/manifest.json');
      var iconHref = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') 
        ? 'https://img.icons8.com/plasticine/128/restaurant.png' 
        : 'https://img.icons8.com/fluency/128/restaurant.png';

      document.write('<link id="pwa-manifest-link" rel="manifest" href="' + manifestHref + '" />');
      document.write('<link id="pwa-icon-link" rel="icon" href="' + iconHref + '" type="image/png" />');
      document.write('<link id="pwa-apple-icon-link" rel="apple-touch-icon" href="' + iconHref + '" />');
    </script>

    <!-- Script de auto-recuperación de caché IndexedDB de Firestore contra límites de serialización en navegadores (ej: Firefox 256MB) -->
    <script>
      (function() {
        var PURGE_FLAG = 'cocinet_firestore_purge_2026_09';
        var needsPurge = localStorage.getItem('needs_firestore_purge') === 'true' || localStorage.getItem(PURGE_FLAG) !== 'done';
        if (needsPurge && window.indexedDB) {
          localStorage.setItem(PURGE_FLAG, 'done');
          localStorage.removeItem('needs_firestore_purge');
          try {
            if (window.indexedDB.databases) {
              window.indexedDB.databases().then(function(dbs) {
                dbs.forEach(function(db) {
                  if (db.name && (db.name.indexOf('firestore') !== -1 || db.name.indexOf('[DEFAULT]') !== -1)) {
                    window.indexedDB.deleteDatabase(db.name);
                  }
                });
              }).catch(function() {});
            }
            var fallbacks = [
              'firestore/[DEFAULT]/cocinet-app/(default)',
              'firestore/[DEFAULT]/cocinet-app/(default)/main',
              'firestore/[DEFAULT]/cocinet-app/',
              'firestore/custom_app/cocinet-app/(default)',
              'firestore',
              '[DEFAULT]main',
              '[DEFAULT]'
            ];
            fallbacks.forEach(function(name) {
              try { window.indexedDB.deleteDatabase(name); } catch(e) {}
            });
            console.warn('🧹 Firestore IndexedDB cache purge completed.');
          } catch (e) {
            console.error('Error purgando IndexedDB:', e);
          }
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reason = String(event && event.reason && (event.reason.message || event.reason) || '');
          if (reason.indexOf('serialized value is too large') !== -1 || reason.indexOf('b815') !== -1) {
            console.error('🚨 Error crítico en IndexedDB detectado. Purgando y reiniciando...', reason);
            localStorage.setItem('needs_firestore_purge', 'true');
            window.location.reload();
          }
        });
      })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
